name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Commits made with GITHUB_TOKEN do not trigger another push workflow.
  workflow_run:
    workflows: [Refresh portfolio content]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build public site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Verify portfolio
        run: npm test
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
